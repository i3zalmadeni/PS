<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f8a94">
<title>ملف المعلم | مجتمع المعلمين الذكي – متوسطة لبيد بن ربيعة</title>
<meta name="description" content="طاقم معلمي مدرسة لبيد بن ربيعة المتوسطة وملفاتهم المهنية.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/public.js"></script><script src="assets/footer.js"></script>
</head><body><script>

const lv = (n, max = 5) => `<div class="lvl" title="المستوى ${n} من ${max}">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? "f" : ""}"></i>`).join("")}</div>`;
const none = (t) => `<div class="empty">${t}</div>`;
pubPage("staff.html", async (v) => {
  const id = new URLSearchParams(location.search).get("id");
  const t = id && /^[0-9a-f-]{36}$/i.test(id) ? await rpc("public_teacher", { p_id: id }) : null;
  if (!t) { v.innerHTML = `<div class="pagehead"><h1>لم نجد هذا الملف</h1><p>قد يكون الرابط غير صحيح أو أن الملف غير متاح للعرض العام.</p></div><a class="btn pri" href="staff.html">العودة إلى المعلمين</a>`; return; }
  document.title = t.full_name + " | مجتمع المعلمين الذكي";
  const A = t.achievements, P = t.practices, G = t.goals, S = t.skills, PR = t.programs, C = t.plcs, I = t.initiatives;
  const done = G.filter((g) => g.status === "completed").length;
  const tabs = [["ov", "نظرة عامة"], ["ac", "الإنجازات", A.length], ["pr", "الممارسات", P.length], ["gr", "النمو المهني", G.length + PR.length], ["cm", "المجتمعات والمبادرات", C.length + I.length]];
  const overview = `<div class="cols"><div>
    <div class="box"><h3>نبذة مهنية</h3><p>${esc(t.bio || "لم تُضف نبذة بعد.")}</p>${(t.interests || []).map((x) => `<span class="tag">${esc(x)}</span>`).join("")}</div>
    ${t.reflection && (t.reflection.strengths || t.reflection.development || t.reflection.future) ? `<div class="box" style="margin-top:14px"><h3>التأمل المهني</h3><dl class="kv">
      ${t.reflection.strengths ? `<dt>نقاط القوة</dt><dd>${esc(t.reflection.strengths)}</dd>` : ""}${t.reflection.development ? `<dt>مجالات التطوير</dt><dd>${esc(t.reflection.development)}</dd>` : ""}${t.reflection.future ? `<dt>أهداف مستقبلية</dt><dd>${esc(t.reflection.future)}</dd>` : ""}</dl></div>` : ""}
    <div class="box" style="margin-top:14px"><h3>أبرز الإنجازات</h3>${A.slice(0, 3).map((a) => `<p><b>${esc(a.title)}</b><br><span class="muted">${esc(L.ach[a.type] || "")} • ${fmt(a.date)}</span></p>`).join("") || none("لا توجد إنجازات معتمدة بعد.")}</div></div>
    <div><div class="box"><h3>بيانات مهنية</h3><dl class="kv"><dt>التخصص</dt><dd>${esc(t.specialty || "—")}</dd><dt>المرحلة</dt><dd>${esc(t.stage || "—")}</dd><dt>الخبرة</dt><dd>${t.years_experience != null ? t.years_experience + " سنة" : "—"}</dd><dt>المؤهل</dt><dd>${esc(t.qualification_summary || "—")}</dd><dt>الانضمام</dt><dd>${fmt(t.joined_at)}</dd></dl></div>
    <div class="box" style="margin-top:14px"><h3>المهارات المعتمدة</h3>${S.slice(0, 5).map((s) => `<p style="margin:8px 0"><b>${esc(s.name)}</b> <span class="muted">• ${esc(L.skillcat[s.category] || "")}</span>${lv(s.level)}</p>`).join("") || none("لا مهارات معتمدة بعد.")}</div></div></div>`;
  const ach = A.length ? `<ul class="tl" style="margin-top:18px">${A.map((a) => `<li><b>${esc(a.title)}</b><span class="tag gold">${esc(L.ach[a.type] || "إنجاز")}</span><small> ${fmt(a.date)}</small><p style="margin:2px 0;color:var(--ink2)">${esc(a.description || "")}</p></li>`).join("")}</ul>` : none("لا توجد إنجازات معتمدة بعد.");
  const prac = P.length ? `<div class="g3" style="margin-top:16px">${P.map((p) => `<div class="box"><span class="tag">${esc(p.category || "ممارسة")}</span><h3>${esc(p.title)}</h3><p>${esc([p.subject, p.grade].filter(Boolean).join(" • "))}</p><p>${esc(p.objective || "")}</p>${p.results ? `<p><b>النتائج:</b> ${esc(p.results)}</p>` : ""}</div>`).join("")}</div>` : none("لا توجد ممارسات منشورة بعد.");
  const growth = `<div class="cols"><div><div class="box"><h3>أهداف النمو المهني (${done} مكتمل من ${G.length})</h3>${G.map((g) => `<div style="margin:12px 0"><b>${esc(g.title)}</b> <span class="tag ${g.status === "completed" ? "ok" : "gold"}">${esc(L.goal[g.status] || g.status)}</span>
      <div class="muted">${esc(g.area || "")} • من مستوى ${g.start_level} إلى ${g.target_level} • الموعد ${fmt(g.target_date)}</div><div class="prog"><i style="width:${g.status === "completed" ? 100 : g.status === "awaiting_documentation" ? 80 : g.status === "in_progress" ? 50 : 20}%"></i></div></div>`).join("") || none("لم تُنشر أهداف بعد.")}</div></div>
    <div><div class="box"><h3>البرامج التي حضرها (${PR.length})</h3>${PR.map((p) => `<p style="margin:8px 0"><b>${esc(p.title)}</b><br><span class="muted">${esc(L.prog[p.type] || "")} • ${fmt(p.date)}</span></p>`).join("") || none("لا برامج بعد.")}</div>
    <div class="box" style="margin-top:14px"><h3>كل المهارات</h3>${S.map((s) => `<p style="margin:8px 0"><b>${esc(s.name)}</b>${lv(s.level)}</p>`).join("") || none("لا مهارات بعد.")}</div></div></div>`;
  const comm = `<div class="cols"><div class="box"><h3>مجتمعات التعلم (${C.length})</h3>${C.map((c) => `<p style="margin:8px 0"><b>${esc(c.name)}</b> <span class="tag ${c.role === "leader" ? "gold" : ""}">${c.role === "leader" ? "قائد المجتمع" : "عضو"}</span></p>`).join("") || none("غير منضم لمجتمعات.")}</div>
    <div class="box"><h3>المبادرات (${I.length})</h3>${I.map((i) => `<p style="margin:8px 0"><b>${esc(i.title)}</b> <span class="tag">${esc(i.role || "عضو")}</span> <span class="tag info">${esc(L.init[i.status] || "")}</span></p>`).join("") || none("لا مبادرات بعد.")}</div></div>`;
  const body = { ov: overview, ac: ach, pr: prac, gr: growth, cm: comm };
  v.innerHTML = `<div class="muted" aria-label="مسار التنقل" style="margin-top:14px"><a href="staff.html">المعلمون</a> › ${esc(short(t.full_name))}</div>
  <div class="phero"><div class="av xl" aria-hidden="true">${esc(initial(t.full_name))}</div><div><h1>${esc(t.full_name)}</h1><div class="sp">معلم ${esc(t.specialty || "")}${t.stage ? " • " + esc(t.stage) : ""}</div>
    <span class="tag">${A.length} إنجاز معتمد</span><span class="tag">${P.length} ممارسة</span><span class="tag">${PR.length} برنامج</span>${t.years_experience != null ? `<span class="tag">${t.years_experience} سنة خبرة</span>` : ""}</div>
    <div class="acts"><button class="btn" id="cp" type="button">نسخ رابط الملف</button><button class="btn" id="pt" type="button">طباعة / PDF</button></div></div>
  ${t.is_demo ? demoNote : ""}
  <div class="tabs" role="tablist">${tabs.map(([k, n, c]) => `<button role="tab" data-k="${k}" aria-selected="false">${n}${c != null ? `<i>${c}</i>` : ""}</button>`).join("")}</div>
  ${tabs.map(([k]) => `<section data-p="${k}" class="hide" role="tabpanel">${body[k]}</section>`).join("")}
  <p class="muted" style="margin-top:26px">تُعرض في هذه الصفحة البيانات المهنية المعتمدة المشارَكة فقط، ولا تُعرض بيانات شخصية أو إدارية.</p>`;
  const show = (k) => { if (!body[k]) k = "ov"; v.querySelectorAll("[data-p]").forEach((s) => s.classList.toggle("hide", s.dataset.p !== k)); v.querySelectorAll(".tabs button").forEach((b) => { const on = b.dataset.k === k; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }); history.replaceState(null, "", "#" + k); };
  v.querySelector(".tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.k); };
  show(location.hash.slice(1) || "ov");
  document.getElementById("cp").onclick = async (e) => { const u = location.origin + location.pathname + "?id=" + t.id; try { await navigator.clipboard.writeText(u); e.target.textContent = "تم النسخ ✓"; } catch { prompt("انسخ الرابط", u); } };
  document.getElementById("pt").onclick = () => { v.querySelectorAll("[data-p]").forEach((s) => s.classList.remove("hide")); window.print(); show(location.hash.slice(1) || "ov"); };
});
</script></body></html>
