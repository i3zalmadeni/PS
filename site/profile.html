<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ملفي المهني – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script>
</head><body><div id="shell"></div><script>

boot("profile.html", async (me, main) => {
  if (!me.teacherId) { main.innerHTML = header("ملفي المهني") + '<div class="note">حسابك غير مرتبط بملف معلم.</div>'; return; }
  const [t, p, q, ts, skills] = await Promise.all([
    sb.from("teachers").select("specialty,years_experience").eq("id", me.teacherId).single(),
    sb.from("professional_profiles").select("*").eq("teacher_id", me.teacherId).maybeSingle(),
    sb.from("teacher_qualifications").select("id,degree,major,institution,graduation_year,verification_status").eq("teacher_id", me.teacherId),
    sb.from("teacher_skills").select("id,level,skills(name)").eq("teacher_id", me.teacherId),
    sb.from("skills").select("id,name").order("name"),
  ]);
  const pr = p.data || {}, tt = t.data || {};
  main.innerHTML = header("ملفي المهني", "ملفك ظاهر لزملائك. الرقم الوظيفي والبريد والجوال لا تظهر لهم.") + `
  <form class="card" id="pf"><label>التخصص</label><input type="text" name="specialty" value="${esc(tt.specialty)}">
  <label>سنوات الخبرة</label><input type="number" name="years" min="0" max="60" value="${esc(tt.years_experience)}">
  <label>نبذة مهنية</label><textarea name="bio" rows="4" maxlength="3000">${esc(pr.bio)}</textarea>
  <label>الاهتمامات (افصل بفاصلة)</label><input type="text" name="interests" value="${esc((pr.professional_interests || []).join("، "))}">
  <label>نقاط القوة</label><textarea name="s" rows="2">${esc(pr.reflection_strengths)}</textarea>
  <label>مجالات التطوير</label><textarea name="d" rows="2">${esc(pr.reflection_development)}</textarea>
  <label>الأهداف المستقبلية</label><textarea name="f" rows="2">${esc(pr.reflection_future)}</textarea>
  <p id="pm"></p><button class="btn">حفظ</button></form>
  <div class="card"><h3 style="margin-top:0">المؤهلات</h3><div id="ql"></div>
  <form id="qf" class="row" style="margin-top:10px"><input type="text" name="degree" placeholder="المؤهل" required style="flex:1"><input type="text" name="major" placeholder="التخصص" style="flex:1"><input type="text" name="inst" placeholder="الجهة" style="flex:1"><input type="number" name="y" placeholder="سنة التخرج" style="width:120px"><button class="btn sec">إضافة</button></form></div>
  <div class="card"><h3 style="margin-top:0">المهارات</h3><div id="sl"></div>
  <form id="sf" class="row" style="margin-top:10px"><select name="skill" required style="flex:1"><option value="">اختر مهارة</option>${(skills.data || []).map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select><input type="number" name="lvl" min="1" max="5" placeholder="1-5" style="width:90px"><button class="btn sec">إضافة</button></form></div>`;
  const drawQ = (rows) => ql.innerHTML = rows.length ? rows.map((x) => `<p>${esc(x.degree)} ${esc(x.major || "")} ${esc(x.institution || "")} ${x.graduation_year || ""} ${badge(x.verification_status)} <a href="#" data-q="${esc(x.id)}">حذف</a></p>`).join("") : '<p class="muted">لم تُضف مؤهلات.</p>';
  const drawS = (rows) => sl.innerHTML = rows.length ? rows.map((x) => `<p>${esc(x.skills?.name)} ${x.level ? "• " + x.level + "/5" : ""} <a href="#" data-s="${esc(x.id)}">حذف</a></p>`).join("") : '<p class="muted">لم تُضف مهارات.</p>';
  let qs = q.data || [], ss = ts.data || []; drawQ(qs); drawS(ss);
  const reload = async () => { qs = (await sb.from("teacher_qualifications").select("id,degree,major,institution,graduation_year,verification_status").eq("teacher_id", me.teacherId)).data || []; ss = (await sb.from("teacher_skills").select("id,level,skills(name)").eq("teacher_id", me.teacherId)).data || []; drawQ(qs); drawS(ss); };
  pf.onsubmit = async (ev) => { ev.preventDefault(); const f = new FormData(pf); pm.className = ""; pm.textContent = "";
    const y = f.get("years");
    const [a, b] = await Promise.all([
      sb.from("teachers").update({ specialty: f.get("specialty").trim() || null, years_experience: y === "" ? null : Number(y) }).eq("id", me.teacherId),
      sb.from("professional_profiles").update({ bio: f.get("bio").trim() || null, professional_interests: f.get("interests").split(/[،,]/).map((x) => x.trim()).filter(Boolean).slice(0, 20),
        reflection_strengths: f.get("s").trim() || null, reflection_development: f.get("d").trim() || null, reflection_future: f.get("f").trim() || null }).eq("teacher_id", me.teacherId)]);
    if (a.error || b.error) { pm.className = "err"; pm.textContent = "تعذر الحفظ."; } else { pm.className = "okmsg"; pm.textContent = "حُفظ الملف."; } };
  qf.onsubmit = async (ev) => { ev.preventDefault(); const f = new FormData(qf); const y = Number(f.get("y"));
    await sb.from("teacher_qualifications").insert({ teacher_id: me.teacherId, degree: f.get("degree").trim(), major: f.get("major").trim() || null, institution: f.get("inst").trim() || null, graduation_year: y >= 1950 && y <= 2100 ? y : null, created_by: me.id });
    qf.reset(); reload(); };
  sf.onsubmit = async (ev) => { ev.preventDefault(); const f = new FormData(sf); const l = Number(f.get("lvl"));
    await sb.from("teacher_skills").upsert({ teacher_id: me.teacherId, skill_id: f.get("skill"), level: l >= 1 && l <= 5 ? l : null, created_by: me.id }, { onConflict: "teacher_id,skill_id" });
    sf.reset(); reload(); };
  main.onclick = async (ev) => { const a = ev.target.closest("a[data-q],a[data-s]"); if (!a) return; ev.preventDefault();
    if (a.dataset.q) await sb.from("teacher_qualifications").delete().eq("id", a.dataset.q); else await sb.from("teacher_skills").delete().eq("id", a.dataset.s); reload(); };
});
</script></body></html>
