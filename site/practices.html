<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f8a94">
<title>الممارسات التعليمية | مجتمع المعلمين الذكي – متوسطة لبيد بن ربيعة</title>
<meta name="description" content="بنك الممارسات التعليمية الموثقة والمعتمدة في مدرسة لبيد بن ربيعة المتوسطة.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/public.js"></script><script src="assets/footer.js"></script>
</head><body><script>
const tcard = (t) => `<a class="box" href="teacher.html?id=${esc(t.id)}"><div class="tcard"><div class="av" aria-hidden="true">${esc(initial(t.full_name))}</div><div class="meta"><h3>${esc(t.full_name)}</h3><p>${esc([t.specialty, t.stage].filter(Boolean).join(" • "))}</p>
${(t.skills || []).map((s) => `<span class="tag">${esc(s)}</span>`).join("")}</div></div>
<div class="nums"><span><b>${t.achievements_count ?? 0}</b> إنجاز معتمد</span><span><b>${t.practices_count ?? 0}</b> ممارسة</span>${t.years_experience != null ? `<span><b>${t.years_experience}</b> سنة خبرة</span>` : ""}</div></a>`;
const pcard = (p) => `<div class="box"><span class="tag">${esc(p.category || "ممارسة")}</span><h3>${esc(p.title)}</h3><p>${esc([p.subject, p.grade].filter(Boolean).join(" • "))}</p><p>${esc(p.objective || "")}</p>
${p.results ? `<p><b>النتائج:</b> ${esc(p.results)}</p>` : ""}<p class="muted">بواسطة <a href="teacher.html?id=${esc(p.author_id)}">${esc(short(p.author_name))}</a> • ${fmt(p.published_at)}</p></div>`;
const gcard = (g) => `<div class="box"><span class="tag ${g.status === "completed" ? "ok" : "gold"}">${esc(L.pstat[g.status] || g.status)}</span><span class="tag info">${esc(L.prog[g.program_type] || "")}</span><h3>${esc(g.title)}</h3><p>${esc(g.description || "")}</p>
<p class="muted">${fmt(g.starts_at)} • ${g.duration_minutes || "—"} دقيقة • ${esc(g.location || "")}</p><p class="muted">المقدّم: ${g.presenter_id ? `<a href="teacher.html?id=${esc(g.presenter_id)}">${esc(short(g.presenter_name))}</a>` : esc(g.presenter_name || "—")}</p>
${g.impact_summary ? `<p><b>الأثر:</b> ${esc(g.impact_summary)}</p>` : ""}${g.status === "completed" ? `<p class="muted">الحضور: ${g.attended}</p>` : ""}</div>`;

pubPage("practices.html", async (v) => {
  const ps = await rpc("public_practices");
  const cats = [...new Set(ps.map((p) => p.category).filter(Boolean))], subs = [...new Set(ps.map((p) => p.subject).filter(Boolean))];
  v.innerHTML = `<div class="pagehead"><span class="kick">بنك الممارسات</span><h1>الممارسات التعليمية</h1><p>ممارسات صفية وثّقها معلمو المدرسة واعتُمدت للنشر، مع أهدافها ونتائجها.</p></div>
  <div class="tools"><input id="q" type="search" placeholder="ابحث في الممارسات…"><select id="c"><option value="">كل التصنيفات</option>${cats.map((s) => `<option>${esc(s)}</option>`).join("")}</select><select id="s"><option value="">كل المواد</option>${subs.map((s) => `<option>${esc(s)}</option>`).join("")}</select></div>
  <p class="muted" id="cnt" aria-live="polite"></p><div class="g3" id="gr"></div>`;
  const draw = () => { const q = document.getElementById("q").value.trim(), c = document.getElementById("c").value, s = document.getElementById("s").value;
    const r = ps.filter((p) => (!c || p.category === c) && (!s || p.subject === s) && (!q || [p.title, p.objective, p.results, p.author_name].join(" ").includes(q)));
    document.getElementById("cnt").textContent = `${r.length} من ${ps.length} ممارسة`; document.getElementById("gr").innerHTML = r.map(pcard).join("") || '<div class="empty" style="grid-column:1/-1">لا نتائج مطابقة.</div>'; };
  ["q", "c", "s"].forEach((i) => document.getElementById(i).addEventListener("input", draw)); draw();
});
</script></body></html>
