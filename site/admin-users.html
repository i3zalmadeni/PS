<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة المعلمين والحسابات – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/compat.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script><script src="assets/footer.js"></script>
</head><body class="pub pg"><div id="shell"></div><script>
const FIELDS = [["full_name","الاسم الكامل *",["الاسم الكامل","الاسم","full_name","name"]],["email","البريد الإلكتروني *",["البريد الإلكتروني","البريد","email"]],
  ["specialty","التخصص",["التخصص","specialty"]],["stage","المرحلة التعليمية",["المرحلة التعليمية","المرحلة","stage"]],
  ["years_experience","سنوات الخبرة",["سنوات الخبرة","الخبرة","years_experience"]],["employee_no","الرقم الوظيفي",["الرقم الوظيفي","employee_no"]],
  ["phone","رقم التواصل",["رقم التواصل","الجوال","phone"]],["job_status","الحالة الوظيفية",["الحالة الوظيفية","job_status"]]];

async function callFn(body, fn = "admin-users") {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(APP_CONFIG.supabaseUrl + "/functions/v1/" + fn, { method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token, apikey: APP_CONFIG.supabaseKey || APP_CONFIG.publishableKey || APP_CONFIG.anonKey },
    body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || "تعذر تنفيذ الطلب"); return j;
}
const csvEsc = (v) => '"' + String(v ?? "").replace(/"/g, '""') + '"';
function downloadCsv(rows) {
  const csv = "﻿" + ["الاسم,البريد,كلمة المرور المؤقتة", ...rows.map((r) => [r.name, r.email, r.password].map(csvEsc).join(","))].join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" })); a.download = "حسابات-المعلمين.csv"; a.click();
}

boot("admin-users.html", async (me, main) => {
  main.innerHTML = header("إدارة المعلمين والحسابات", "أضف معلمًا واحدًا، أو استورد قائمة من Excel. تُنشأ الحسابات بكلمات مرور مؤقتة تُسلَّم للمعلمين.") + `
  <div class="card"><h3 style="margin-top:0">إضافة معلم</h3><form id="one">
    <div class="grid"><div><label>الاسم الكامل *</label><input name="full_name" required maxlength="200"></div>
    <div><label>البريد الإلكتروني *</label><input name="email" type="email" dir="ltr" required></div>
    <div><label>التخصص</label><input name="specialty"></div><div><label>المرحلة التعليمية</label><input name="stage"></div>
    <div><label>سنوات الخبرة</label><input name="years_experience" type="number" min="0" max="60"></div>
    <div><label>الرقم الوظيفي</label><input name="employee_no"></div>
    <div><label>رقم التواصل</label><input name="phone" dir="ltr"></div><div><label>الحالة الوظيفية</label><input name="job_status"></div></div>
    <p id="om" class="err" role="alert"></p><button class="btn">إضافة وإنشاء الحساب</button></form></div>
  <div class="card"><h3 style="margin-top:0">استيراد من Excel</h3>
    <p class="muted">١) نزّل القالب ٢) عبّئه ٣) ارفعه وراجع المعاينة ٤) نفّذ الاستيراد. السجلات الصحيحة فقط تُستورد، والمكررة (حسب البريد) تُحدَّث ولا تُنشأ مرتين.</p>
    <button class="btn sec" id="tpl" type="button">تنزيل القالب</button>
    <label>ملف Excel (.xlsx)</label><input type="file" id="xf" accept=".xlsx,.xls">
    <div id="map"></div><div id="prev"></div></div>
  <div class="card"><h3 style="margin-top:0">المعلمون الحاليون وتعديل الحسابات</h3>
    <input id="q" placeholder="بحث بالاسم أو البريد أو التخصص" style="max-width:360px"><div id="lst" style="margin-top:10px"></div></div>
  <div id="ed"></div><div id="out"></div>`;

  function showResults(list) {
    const withPw = list.filter((r) => r.password);
    out.innerHTML = `<div class="card"><h3 style="margin-top:0">النتيجة</h3>
      <p>أُنشئ: ${list.filter((r) => r.status === "created").length} • حُدّث: ${list.filter((r) => r.status === "updated").length} • تعذّر/مكرر: ${list.filter((r) => !["created", "updated"].includes(r.status)).length}</p>
      ${withPw.length ? `<p class="note">كلمات المرور تظهر الآن فقط ولا تُحفظ. نزّلها وسلّمها لكل معلم، وسيغيّرها بعد أول دخول.</p><button class="btn" id="dl">تنزيل الحسابات (CSV)</button>` : ""}
      <table style="width:100%;border-collapse:collapse;margin-top:12px">${list.map((r) => `<tr style="border-top:1px solid #E3EEF3"><td>${esc(r.name || "")}</td><td dir="ltr">${esc(r.email || "")}</td><td>${esc(r.status)}</td><td dir="ltr">${esc(r.password || "")}</td><td>${esc(r.error || r.note || "")}</td></tr>`).join("")}</table></div>`;
    if (withPw.length) dl.onclick = () => downloadCsv(withPw);
    out.scrollIntoView();
  }


  let all = [];
  async function loadList() {
    const [{ data: ts }, { data: ps }] = await Promise.all([
      sb.from("teachers").select("id,user_id,full_name,specialty,stage,years_experience,is_active,show_public").order("full_name"),
      sb.from("teacher_private").select("teacher_id,email,employee_no,phone,job_status")]);
    const pm = Object.fromEntries((ps || []).map((p) => [p.teacher_id, p]));
    all = (ts || []).map((t) => ({ ...t, ...(pm[t.id] || {}) })); drawList();
  }
  function drawList() {
    const k = q.value.trim().toLowerCase();
    const rows = all.filter((t) => !k || [t.full_name, t.email, t.specialty].some((v) => String(v || "").toLowerCase().includes(k)));
    lst.innerHTML = rows.length ? `<table style="width:100%;border-collapse:collapse"><tr><th>الاسم</th><th>البريد</th><th>التخصص</th><th>الحساب</th><th></th></tr>` +
      rows.map((t) => `<tr style="border-top:1px solid #E3EEF3"><td>${esc(t.full_name)}</td><td dir="ltr">${esc(t.email || "")}</td><td>${esc(t.specialty || "")}</td>
      <td>${t.is_active ? "نشط" : "موقوف"}${t.user_id ? "" : " • بلا حساب"}</td><td><button class="btn sec" data-e="${t.id}" type="button">تعديل</button></td></tr>`).join("") + "</table>" : '<p class="muted">لا نتائج.</p>';
    lst.querySelectorAll("[data-e]").forEach((b) => (b.onclick = () => editForm(all.find((t) => t.id === b.dataset.e))));
  }
  q.oninput = drawList;
  function editForm(t) {
    const v = (x) => esc(x ?? "");
    ed.innerHTML = `<div class="card" id="edc"><h3 style="margin-top:0">تعديل: ${v(t.full_name)}</h3><form id="ef">
      <div class="grid"><div><label>الاسم الكامل *</label><input name="full_name" required maxlength="200" value="${v(t.full_name)}"></div>
      <div><label>البريد الإلكتروني *</label><input name="email" type="email" dir="ltr" required value="${v(t.email)}"></div>
      <div><label>التخصص</label><input name="specialty" value="${v(t.specialty)}"></div><div><label>المرحلة التعليمية</label><input name="stage" value="${v(t.stage)}"></div>
      <div><label>سنوات الخبرة</label><input name="years_experience" type="number" min="0" max="60" value="${v(t.years_experience)}"></div>
      <div><label>الرقم الوظيفي</label><input name="employee_no" value="${v(t.employee_no)}"></div>
      <div><label>رقم التواصل</label><input name="phone" dir="ltr" value="${v(t.phone)}"></div><div><label>الحالة الوظيفية</label><input name="job_status" value="${v(t.job_status)}"></div></div>
      <label><input type="checkbox" name="is_active" ${t.is_active ? "checked" : ""} style="width:auto"> الحساب نشط (إلغاؤه يوقف الدخول)</label><br>
      <label><input type="checkbox" name="show_public" ${t.show_public ? "checked" : ""} style="width:auto"> يظهر في الصفحة العامة للمدرسة</label>
      <p id="em" class="err" role="alert"></p>
      <button class="btn">حفظ التعديلات</button> <button class="btn sec" type="button" id="rp" ${t.user_id ? "" : "disabled"}>إعادة تعيين كلمة المرور</button>
      <button class="btn sec" type="button" id="cx">إغلاق</button></form></div>`;
    cx.onclick = () => (ed.innerHTML = "");
    rp.onclick = async () => { if (!confirm("سيتم إنشاء كلمة مرور مؤقتة جديدة. متابعة؟")) return;
      try { const r = await callFn({ action: "reset_password", teacher_id: t.id }); showResults([{ name: t.full_name, email: t.email, status: "updated", password: r.password }]); }
      catch (x) { em.textContent = x.message; } };
    ef.onsubmit = async (e) => { e.preventDefault(); em.textContent = ""; const fd = new FormData(ef); const f = Object.fromEntries(fd);
      f.is_active = fd.has("is_active"); f.show_public = fd.has("show_public"); e.submitter.disabled = true;
      try { await callFn({ action: "update_teacher", teacher_id: t.id, fields: f }, "admin-teacher-edit"); ed.innerHTML = '<p class="note">تم حفظ التعديلات.</p>'; await loadList(); }
      catch (x) { em.textContent = x.message; e.submitter.disabled = false; } };
    edc.scrollIntoView();
  }
  loadList();

  one.onsubmit = async (e) => { e.preventDefault(); om.textContent = "";
    const t = Object.fromEntries(new FormData(one)); const btn = e.submitter; btn.disabled = true;
    try { const { result } = await callFn({ action: "create_teacher", teacher: t });
      if (result.status === "invalid") om.textContent = result.error; else { showResults([result]); one.reset(); loadList(); }
    } catch (x) { om.textContent = x.message; } btn.disabled = false; };

  tpl.onclick = () => { const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet([FIELDS.map((f) => f[1].replace(" *", "")), ["مثال: أحمد محمد", "ahmed@example.com", "رياضيات", "المتوسطة", 5, "", "", ""]]);
    XLSX.utils.book_append_sheet(wb, ws, "المعلمون"); XLSX.writeFile(wb, "قالب-المعلمين.xlsx"); };

  let sheet = null, fname = "";
  xf.onchange = async () => { const f = xf.files[0]; if (!f) return; fname = f.name;
    if (f.size > 5242880) { map.innerHTML = '<p class="err">الملف أكبر من 5 ميغابايت.</p>'; return; }
    const wb = XLSX.read(await f.arrayBuffer(), { type: "array" });
    sheet = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: false });
    if (!sheet.length) { map.innerHTML = '<p class="err">الملف فارغ.</p>'; return; }
    const cols = Object.keys(sheet[0]);
    map.innerHTML = '<h4>مطابقة الأعمدة</h4><div class="grid">' + FIELDS.map(([k, label, alias]) => {
      const guess = cols.find((c) => alias.includes(c.trim())) || "";
      return `<div><label>${esc(label)}</label><select data-f="${k}"><option value="">— لا شيء —</option>${cols.map((c) => `<option ${c === guess ? "selected" : ""}>${esc(c)}</option>`).join("")}</select></div>`;
    }).join("") + '</div><button class="btn sec" id="pv" type="button">معاينة</button>';
    pv.onclick = preview; preview(); };

  function mapped() { const m = {}; map.querySelectorAll("select").forEach((s) => { if (s.value) m[s.dataset.f] = s.value; });
    return { m, rows: sheet.map((r) => Object.fromEntries(Object.entries(m).map(([k, c]) => [k, r[c]]))) }; }

  function preview() { const { m, rows } = mapped();
    if (!m.full_name || !m.email) { prev.innerHTML = '<p class="err">اربط عمودي الاسم والبريد على الأقل.</p>'; return; }
    const seen = new Set(); let bad = 0;
    const trs = rows.map((r, i) => { const em = String(r.email || "").trim().toLowerCase(); let err = "";
      if (String(r.full_name || "").trim().length < 2) err = "الاسم ناقص"; else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) err = "بريد غير صحيح"; else if (seen.has(em)) err = "مكرر داخل الملف";
      seen.add(em); if (err) bad++;
      return `<tr style="border-top:1px solid #E3EEF3;${err ? "background:#FDEEEE" : ""}"><td>${i + 2}</td><td>${esc(r.full_name)}</td><td dir="ltr">${esc(em)}</td><td>${esc(err || "صالح")}</td></tr>`; });
    prev.innerHTML = `<p>إجمالي الصفوف: ${rows.length} • صالحة: ${rows.length - bad} • بها أخطاء: ${bad}</p>
      <table style="width:100%;border-collapse:collapse"><tr><th>#</th><th>الاسم</th><th>البريد</th><th>الحالة</th></tr>${trs.slice(0, 100).join("")}</table>
      ${rows.length > 100 ? '<p class="muted">تُعرض أول 100 صف فقط.</p>' : ""}${rows.length > 500 ? '<p class="err">الحد الأقصى 500 صف في كل استيراد.</p>' : ""}
      <p id="im" class="err" role="alert"></p><button class="btn" id="go" ${rows.length > 500 || rows.length === bad ? "disabled" : ""}>استيراد الصالح فقط (${rows.length - bad})</button>`;
    go.onclick = async () => { go.disabled = true; go.textContent = "جارٍ الاستيراد…";
      try { const r = await callFn({ action: "import", rows, mapping: m, file_name: fname }); showResults(r.results.map((x) => ({ ...x, name: x.name || "" }))); prev.innerHTML = ""; }
      catch (x) { im.textContent = x.message; go.disabled = false; go.textContent = "إعادة المحاولة"; } }; }
});
</script></body></html>
