<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدخول – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script>
</head><body><div class="login"><div class="card"><h2 class="title">مجتمع المعلمين الذكي</h2>
<p class="sub">متوسطة لبيد بن ربيعة – الدخول بدعوة من المنسق</p>
<form id="f"><label for="e">البريد الإلكتروني</label><input id="e" type="email" required autocomplete="username" dir="ltr">
<label for="p">كلمة المرور</label><input id="p" type="password" required autocomplete="current-password" dir="ltr">
<p id="m" class="err" role="alert"></p><button class="btn" id="b">دخول</button>
<p><a href="#" id="fg" class="muted">نسيت كلمة المرور؟</a></p></form></div></div><script>

const q = new URLSearchParams(location.search);
if (q.get("e") === "inactive") document.getElementById("m").textContent = "الحساب غير مفعّل. تواصل مع المنسق.";
sb.auth.getSession().then(({ data }) => { if (data.session) location.replace("home.html"); });
document.getElementById("f").onsubmit = async (ev) => {
  ev.preventDefault(); const m = document.getElementById("m"), b = document.getElementById("b"); m.textContent = ""; b.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: e.value.trim(), password: p.value });
  b.disabled = false;
  if (error) { m.textContent = "بيانات الدخول غير صحيحة."; return; }
  location.replace("home.html");
};
document.getElementById("fg").onclick = async (ev) => {
  ev.preventDefault(); const m = document.getElementById("m");
  if (!e.value.trim()) { m.textContent = "اكتب بريدك أولًا."; return; }
  await sb.auth.resetPasswordForEmail(e.value.trim(), { redirectTo: new URL("set-password.html", location.href).href });
  m.className = "okmsg"; m.textContent = "إن كان البريد مسجلًا فستصلك رسالة.";
};
</script></body></html>
