<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول – النواة الرقمية</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/core.css"></head><body class="pubsite lgbody">
<div id="hdr"></div>
<div class="login card lgc"><div class="lgi" data-core></div><h2>تسجيل الدخول</h2><p class="sub">النواة الرقمية · متوسطة لبيد بن ربيعة</p>
<form id="f"><label for="e">البريد الإلكتروني</label><input id="e" type="email" required autocomplete="username">
<label for="p">كلمة المرور</label><input id="p" type="password" required autocomplete="current-password">
<p class="err" id="m" role="alert"></p><button class="btn" id="go">دخول</button></form></div><div id="ftr"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/chrome.js"></script><script src="assets/config.js"></script><script>
pubInit("login.html");
const sb = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseKey);
if (location.search.includes("nostaff")) document.getElementById("m").textContent = "هذا الحساب غير مرتبط بسجل منسوب.";
sb.auth.getSession().then(({ data }) => { if (data.session) location.replace("dashboard.html"); });
document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault();
  const m = document.getElementById("m"), go = document.getElementById("go"); if (go.disabled) return;
  m.textContent = ""; go.disabled = true;
  const { error } = await sb.auth.signInWithPassword({ email: document.getElementById("e").value.trim(), password: document.getElementById("p").value });
  if (!error) { location.replace("dashboard.html"); return; }
  go.disabled = false;
  m.textContent = error.code === "email_not_confirmed" ? "البريد الإلكتروني غير مؤكد." : (error.code === "invalid_credentials" || error.status === 400) ? "بيانات الدخول غير صحيحة." : "تعذر الاتصال بالخادم، حاول مرة أخرى."; };
</script></body></html>
