<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول – النواة الرقمية</title><link rel="stylesheet" href="assets/core.css"></head><body>
<div class="login card"><h2>النواة الرقمية</h2><p class="sub">متوسطة لبيد بن ربيعة</p>
<form id="f"><label for="e">البريد الإلكتروني</label><input id="e" type="email" required autocomplete="username">
<label for="p">كلمة المرور</label><input id="p" type="password" required autocomplete="current-password">
<p class="err" id="m" role="alert"></p><button>دخول</button></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script>
const sb = supabase.createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabaseKey);
if (location.search.includes("nostaff")) document.getElementById("m").textContent = "هذا الحساب غير مرتبط بسجل منسوب.";
document.getElementById("f").onsubmit = async (ev) => { ev.preventDefault();
  const { error } = await sb.auth.signInWithPassword({ email: e.value, password: p.value });
  if (error) document.getElementById("m").textContent = "بيانات الدخول غير صحيحة."; else location.replace("dashboard.html"); };
</script></body></html>
