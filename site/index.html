<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرئيسية – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script>
</head><body><div id="shell"></div><script>

boot("index.html", async (me, main) => {
  const cnt = async (q) => (await q).count ?? 0;
  const head = { count: "exact", head: true };
  let html = header("مرحبًا " + me.name, "ملخصك المهني وأحدث المستجدات");
  if (isReviewer(me)) {
    const [pending, teachers, ach, goals] = await Promise.all([
      cnt(sb.from("achievements").select("id", head).in("status", ["submitted", "under_review"])),
      cnt(sb.from("teachers").select("id", head).eq("is_active", true)),
      cnt(sb.from("achievements").select("id", head)),
      cnt(sb.from("professional_goals").select("id", head)),
    ]);
    html += `<div class="grid">
      <a class="card stat" href="review.html" style="text-decoration:none"><b>${pending}</b><span>اعتمادات بانتظار المراجعة</span></a>
      <div class="card stat"><b>${teachers}</b><span>معلمون نشطون</span></div>
      <div class="card stat"><b>${ach}</b><span>إنجازات مسجلة</span></div>
      <div class="card stat"><b>${goals}</b><span>أهداف نمو مسجلة</span></div></div>`;
  }
  if (me.teacherId) {
    const [g, a, ap, rev] = await Promise.all([
      cnt(sb.from("professional_goals").select("id", head).eq("teacher_id", me.teacherId)),
      cnt(sb.from("achievements").select("id", head).eq("teacher_id", me.teacherId)),
      cnt(sb.from("achievements").select("id", head).eq("teacher_id", me.teacherId).eq("status", "approved")),
      cnt(sb.from("achievements").select("id", head).eq("teacher_id", me.teacherId).in("status", ["submitted", "under_review"])),
    ]);
    html += `<h3>نشاطك</h3><div class="grid">
      <a class="card stat" href="growth.html" style="text-decoration:none"><b>${g}</b><span>أهداف نمو</span></a>
      <a class="card stat" href="achievements.html" style="text-decoration:none"><b>${a}</b><span>إنجازات</span></a>
      <div class="card stat"><b>${ap}</b><span>إنجازات معتمدة</span></div>
      <div class="card stat"><b>${rev}</b><span>قيد المراجعة</span></div></div>`;
  } else if (!isReviewer(me)) {
    html += `<div class="note">حسابك غير مرتبط بملف معلم. تواصل مع منسق النمو المهني.</div>`;
  }
  main.innerHTML = html;
});
</script></body></html>
