<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مجتمعات التعلم المهنية – مجتمع المعلمين الذكي</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/compat.css"><link rel="stylesheet" href="assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script><script src="assets/footer.js"></script>
</head><body class="pub pg"><div id="shell"></div><script>
boot("plc.html", async (me, main) => {
  const isMgr = ["system_admin", "coordinator"].includes(me.role);
  main.innerHTML = header("مجتمعات التعلم المهنية", "فرق مهنية تتعلم معًا: نقاش، ومكتبة ملفات، وتوثيق، واجتماعات، وخطة عمل. محتوى المجتمع لأعضائه فقط.") +
    `<div id="mine"></div><h3>كل المجتمعات</h3><div class="grid" id="all" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))"></div>` + (isMgr ? `<div class="card" style="margin-top:20px"><h3 style="margin-top:0">إنشاء مجتمع جديد</h3><form id="nf">
      <div class="grid"><div><label>اسم المجتمع *</label><input type="text" name="name" required maxlength="150"></div><div><label>المجال</label><input type="text" name="domain" placeholder="التدريس، التقنية، التقويم…"></div></div>
      <label>وصف المجتمع</label><textarea name="description" rows="2"></textarea><label>الأهداف</label><textarea name="goals" rows="2"></textarea>
      <label>قائد المجتمع (رئيس الفريق) *</label><select name="leader" required id="ld"></select>
      <label>أعضاء الفريق</label><div id="mem" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));max-height:220px;overflow:auto;gap:4px"></div>
      <p id="nm" class="err" role="alert"></p><button class="btn">إنشاء المجتمع</button></form></div>` : "");

  const [g, m, ev, teachers] = await Promise.all([
    sb.from("plc_groups").select("id,name,description,domain,status,established_on").order("name"),
    sb.from("plc_members").select("group_id,teacher_id,role"),
    sb.from("plc_events").select("group_id,title,starts_at").gte("starts_at", new Date().toISOString()).order("starts_at"),
    sb.from("teachers").select("id,full_name").eq("is_active", true).order("full_name")]);
  const tn = new Map((teachers.data || []).map((t) => [t.id, t.full_name]));
  const groups = g.data || [], members = m.data || [];
  const mineIds = new Set(members.filter((x) => x.teacher_id === me.teacherId).map((x) => x.group_id));
  const card = (x) => { const ms = members.filter((y) => y.group_id === x.id), lead = ms.find((y) => y.role === "leader"), nx = (ev.data || []).find((e) => e.group_id === x.id), joined = mineIds.has(x.id);
    return `<div class="card" style="margin:0"><div class="row"><h3 style="margin:0">${esc(x.name)}</h3>${x.status !== "active" ? badge("draft") : ""}</div>
      <p class="muted">${esc(x.domain || "")}${x.domain ? " • " : ""}${ms.length} عضو${lead ? " • القائد: " + esc(tn.get(lead.teacher_id) || "") : ""}</p><p>${esc(x.description || "")}</p>
      ${nx ? `<p class="muted">القادم: ${esc(nx.title)} • ${fmtDate(nx.starts_at)}</p>` : ""}
      <a class="btn" href="plc-group.html?id=${esc(x.id)}">${joined || isReviewer(me) ? "فتح المجتمع" : "عرض المجتمع"}</a>
      ${!joined && me.teacherId && x.status === "active" ? ` <button class="btn sec" data-join="${esc(x.id)}">انضمام</button>` : ""}</div>`; };
  const mine = groups.filter((x) => mineIds.has(x.id));
  document.getElementById("mine").innerHTML = me.teacherId ? `<h3>مجتمعاتي (${mine.length})</h3><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));margin-bottom:20px">${mine.map(card).join("") || '<p class="muted">لم تنضم إلى مجتمع بعد.</p>'}</div>` : "";
  document.getElementById("all").innerHTML = groups.map(card).join("") || '<p class="muted">لا توجد مجتمعات بعد.</p>';
  main.addEventListener("click", async (e) => { const b = e.target.closest("[data-join]"); if (!b) return; b.disabled = true;
    const { error } = await sb.from("plc_members").insert({ group_id: b.dataset.join, teacher_id: me.teacherId, role: "member" });
    if (error) { alert("تعذر الانضمام."); b.disabled = false; return; } location.href = "plc-group.html?id=" + b.dataset.join; });
  if (isMgr) {
    const opts = (teachers.data || []).map((t) => `<option value="${esc(t.id)}">${esc(t.full_name)}</option>`).join("");
    ld.innerHTML = '<option value="">— اختر القائد —</option>' + opts;
    document.getElementById("mem").innerHTML = (teachers.data || []).map((t) => `<label style="margin:0;display:flex;gap:8px;align-items:center"><input type="checkbox" value="${esc(t.id)}"> ${esc(t.full_name)}</label>`).join("");
    nf.onsubmit = async (ev2) => { ev2.preventDefault(); nm.textContent = ""; const f = new FormData(nf), btn = ev2.submitter; btn.disabled = true;
      const { data: grp, error } = await sb.from("plc_groups").insert({ name: f.get("name").trim(), domain: f.get("domain").trim() || null, description: f.get("description").trim() || null, goals: f.get("goals").trim() || null, status: "active", work_plan_status: "draft", established_on: new Date().toISOString().slice(0, 10), source_type: "manual", created_by: me.id }).select("id").single();
      if (error || !grp) { nm.textContent = "تعذر إنشاء المجتمع."; btn.disabled = false; return; }
      const ids = new Set([...mem.querySelectorAll("input:checked")].map((i) => i.value)); ids.delete(f.get("leader"));
      const rows = [{ group_id: grp.id, teacher_id: f.get("leader"), role: "leader" }, ...[...ids].map((t) => ({ group_id: grp.id, teacher_id: t, role: "member" }))];
      const r2 = await sb.from("plc_members").insert(rows); if (r2.error) { nm.textContent = "أُنشئ المجتمع لكن تعذرت إضافة بعض الأعضاء."; }
      location.href = "plc-group.html?id=" + grp.id; };
  }
});
</script></body></html>
