<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تعيين كلمة المرور – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

</head><body class="pub pg"><script>document.body.insertAdjacentHTML("afterbegin", siteHeader('<a href="index.html">الرئيسية</a><a href="login.html" class="navbtn">دخول</a>')); wireNavToggle();</script><div class="login"><div class="card"><h2 class="title">تعيين كلمة المرور</h2>
<form id="f"><label for="p">كلمة المرور الجديدة (8 أحرف فأكثر)</label><input id="p" type="password" minlength="8" required dir="ltr" autocomplete="new-password">
<label for="p2">تأكيد كلمة المرور</label><input id="p2" type="password" minlength="8" required dir="ltr" autocomplete="new-password">
<p id="m" class="err" role="alert"></p><button class="btn">حفظ ومتابعة</button></form></div></div><script>

let ready = false;
sb.auth.onAuthStateChange((ev, s) => { if (s) ready = true; });
document.getElementById("f").onsubmit = async (ev) => {
  ev.preventDefault(); const m = document.getElementById("m");
  if (p.value !== p2.value) { m.textContent = "كلمتا المرور غير متطابقتين."; return; }
  const { data } = await sb.auth.getSession();
  if (!data.session) { m.textContent = "انتهت صلاحية الرابط. اطلب دعوة أو رابطًا جديدًا."; return; }
  const { error } = await sb.auth.updateUser({ password: p.value });
  if (error) { m.textContent = "تعذر الحفظ: " + error.message; return; }
  landing().then((u) => location.replace(u));
};
</script></body></html>
