<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مجتمع التعلم المهني – مجتمع المعلمين الذكي</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css"><link rel="stylesheet" href="assets/compat.css"><link rel="stylesheet" href="assets/site.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script><script src="assets/footer.js"></script>
</head><body class="pub pg"><div id="shell"></div><script>
const dt = (d) => (d ? new Date(d).toLocaleString("ar-SA-u-nu-latn", { dateStyle: "medium", timeStyle: "short" }) : "—");
const nl = (s) => esc(s || "").replace(/\n/g, "<br>");
const DOC_T = { practice: "ممارسة موثقة", recommendation: "توصية", summary: "ملخص", result: "نتيجة", reflection: "تأمل" };
const FILE_C = { reference: "مرجع", minutes: "محضر", presentation: "عرض", template: "نموذج", output: "مخرج", other: "أخرى" };
const EV_K = { meeting: "اجتماع", workshop: "ورشة", deadline: "موعد تسليم", visit: "زيارة", other: "أخرى" };
const MEET_S = { scheduled: "مجدول", held: "عُقد", cancelled: "ملغى" };
const TASK_S = { open: "مفتوحة", in_progress: "قيد التنفيذ", done: "منجزة", cancelled: "ملغاة" };
const PLAN_S = { draft: "مسودة", submitted: "مقدَّمة للاعتماد", under_review: "قيد المراجعة", approved: "معتمدة", needs_revision: "تحتاج تعديلًا", rejected: "مرفوضة" };

boot("plc.html", async (me, main) => {
  const id = new URLSearchParams(location.search).get("id");
  if (!/^[0-9a-f-]{36}$/i.test(id || "")) { location.replace("plc.html"); return; }
  const isMgr = ["system_admin", "coordinator"].includes(me.role);
  let G, M, T = new Map();
  async function loadBase() {
    const [g, m, t] = await Promise.all([sb.from("plc_groups").select("*").eq("id", id).maybeSingle(), sb.from("plc_members").select("id,teacher_id,role,joined_at").eq("group_id", id), sb.from("teachers").select("id,full_name,specialty").eq("is_active", true).order("full_name")]);
    G = g.data; M = m.data || []; T = new Map((t.data || []).map((x) => [x.id, x])); return t.data || [];
  }
  const allT = await loadBase();
  if (!G) { main.innerHTML = header("المجتمع غير موجود") + '<a class="btn" href="plc.html">العودة</a>'; return; }
  const mine = M.find((x) => x.teacher_id === me.teacherId), isMember = !!mine, isLeader = mine?.role === "leader", canLead = isLeader || isMgr, canPost = isMember || isMgr, canSee = isMember || isReviewer(me);
  const nm = (tid) => T.get(tid)?.full_name || "—";
  const lead = M.find((x) => x.role === "leader");

  main.innerHTML = `<p class="muted"><a href="plc.html">مجتمعات التعلم</a> › ${esc(G.name)}</p>` + header(G.name, [G.domain, `${M.length} عضو`, lead ? "القائد: " + nm(lead.teacher_id) : ""].filter(Boolean).join(" • "));
  if (!canSee) {
    main.insertAdjacentHTML("beforeend", `<div class="card"><p>${esc(G.description || "")}</p><p class="note">محتوى المجتمع (النقاش والملفات والتوثيق والاجتماعات) متاح لأعضائه فقط.</p>${me.teacherId && G.status === "active" ? '<button class="btn" id="jn">انضمام إلى المجتمع</button>' : ""}</div>`);
    const j = document.getElementById("jn"); if (j) j.onclick = async () => { const { error } = await sb.from("plc_members").insert({ group_id: id, teacher_id: me.teacherId, role: "member" }); if (error) alert("تعذر الانضمام."); else location.reload(); };
    return;
  }
  const TABS = [["ov", "نظرة عامة"], ["dc", "حلقة النقاش"], ["fl", "مكتبة الملفات"], ["dk", "التوثيق"], ["ev", "الأحداث القادمة"], ["mt", "الاجتماعات"], ["pl", "خطة المجتمع"]];
  main.insertAdjacentHTML("beforeend", `<div class="tabs" role="tablist" style="position:static">${TABS.map(([k, n]) => `<button role="tab" data-k="${k}">${n}</button>`).join("")}</div><div id="tab"></div>`);
  const tab = document.getElementById("tab");
  const sel = (arr, f) => arr.map(f).join("");
  const memberOpts = (v) => M.map((x) => `<option value="${esc(x.teacher_id)}" ${x.teacher_id === v ? "selected" : ""}>${esc(nm(x.teacher_id))}</option>`).join("");
  const R = {};

  /* ---------- نظرة عامة + الفريق ---------- */
  R.ov = async () => {
    const [ev, ds, tk] = await Promise.all([sb.from("plc_events").select("title,starts_at,kind").eq("group_id", id).gte("starts_at", new Date().toISOString()).order("starts_at").limit(3), sb.from("plc_discussions").select("id,title,created_at").eq("group_id", id).order("created_at", { ascending: false }).limit(3), sb.from("plc_tasks").select("status").eq("group_id", id)]);
    const done = (tk.data || []).filter((x) => x.status === "done").length;
    const sorted = [...M].sort((a, b) => (b.role === "leader") - (a.role === "leader") || nm(a.teacher_id).localeCompare(nm(b.teacher_id), "ar"));
    const addable = allT.filter((t) => !M.some((m) => m.teacher_id === t.id));
    tab.innerHTML = `<div class="cols"><div>
      <div class="card"><h3 style="margin-top:0">عن المجتمع</h3><p>${nl(G.description) || '<span class="muted">لا وصف.</span>'}</p>${G.goals ? `<h4>الأهداف</h4><p>${nl(G.goals)}</p>` : ""}<p class="muted">تأسس ${fmtDate(G.established_on)}</p></div>
      <div class="card"><h3 style="margin-top:0">القادم</h3>${(ev.data || []).map((e) => `<p style="margin:6px 0"><b>${esc(e.title)}</b> <span class="badge">${esc(EV_K[e.kind] || "")}</span><br><span class="muted">${dt(e.starts_at)}</span></p>`).join("") || '<p class="muted">لا أحداث قادمة.</p>'}</div>
      <div class="card"><h3 style="margin-top:0">آخر النقاشات</h3>${(ds.data || []).map((d) => `<p style="margin:6px 0"><b>${esc(d.title)}</b> <span class="muted">• ${fmtDate(d.created_at)}</span></p>`).join("") || '<p class="muted">لا نقاشات بعد.</p>'}</div></div>
      <div><div class="card"><h3 style="margin-top:0">الفريق (${M.length})</h3>${sorted.map((x) => `<div class="row" style="padding:6px 0;border-top:1px solid var(--line)"><span><b>${esc(nm(x.teacher_id))}</b><br><span class="muted">${esc(T.get(x.teacher_id)?.specialty || "")}</span></span>
        <span>${x.role === "leader" ? '<span class="badge warn">رئيس الفريق</span>' : '<span class="badge">عضو</span>'}
        ${isMgr && x.role !== "leader" ? ` <button class="btn sec" data-lead="${esc(x.id)}" title="تعيين رئيسًا">رئيس</button>` : ""}${canLead && x.role !== "leader" ? ` <button class="btn sec" data-rm="${esc(x.id)}">إزالة</button>` : ""}</span></div>`).join("")}
        ${canLead ? `<form id="am" style="margin-top:12px"><label>إضافة عضو</label><select name="t" required><option value="">— اختر معلمًا —</option>${sel(addable, (t) => `<option value="${esc(t.id)}">${esc(t.full_name)}</option>`)}</select><button class="btn" style="margin-top:8px">إضافة</button></form>` : ""}
        ${isMember && !isLeader ? '<button class="btn sec red" id="lv" style="margin-top:12px">مغادرة المجتمع</button>' : ""}</div>
      <div class="card"><h3 style="margin-top:0">تقدم المهام</h3><p style="font-size:1.4rem;margin:0"><b>${done}</b> <span class="muted" style="font-size:.9rem">من ${(tk.data || []).length}</span></p></div></div></div>`;
    const am = document.getElementById("am"); if (am) am.onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.from("plc_members").insert({ group_id: id, teacher_id: new FormData(am).get("t"), role: "member" }); if (error) alert("تعذرت الإضافة."); await loadBase(); R.ov(); };
    const lv = document.getElementById("lv"); if (lv) lv.onclick = async () => { if (confirm("مغادرة المجتمع؟")) { await sb.from("plc_members").delete().eq("id", mine.id); location.href = "plc.html"; } };
    tab.onclick = async (e) => { const r = e.target.closest("[data-rm]"), l = e.target.closest("[data-lead]");
      if (r && confirm("إزالة العضو من المجتمع؟")) { await sb.from("plc_members").delete().eq("id", r.dataset.rm); await loadBase(); R.ov(); }
      if (l && confirm("تعيين هذا العضو رئيسًا للفريق؟ سيصبح الرئيس الحالي عضوًا.")) { const cur = M.find((x) => x.role === "leader"); if (cur) await sb.from("plc_members").update({ role: "member" }).eq("id", cur.id); await sb.from("plc_members").update({ role: "leader" }).eq("id", l.dataset.lead); await loadBase(); R.ov(); } };
  };

  /* ---------- حلقة النقاش ---------- */
  R.dc = async () => {
    const [d, r] = await Promise.all([sb.from("plc_discussions").select("id,title,body,pinned,author_id,created_at").eq("group_id", id).order("pinned", { ascending: false }).order("created_at", { ascending: false }), sb.from("plc_replies").select("id,discussion_id,body,author_id,created_at").eq("group_id", id).order("created_at")]);
    const rep = {}; (r.data || []).forEach((x) => (rep[x.discussion_id] ||= []).push(x));
    tab.innerHTML = (canPost ? `<form class="card" id="nd"><h3 style="margin-top:0">موضوع جديد</h3><label>العنوان *</label><input type="text" name="title" required maxlength="200"><label>المحتوى *</label><textarea name="body" rows="3" required></textarea><p class="muted">لا تذكر بيانات الطلاب أو أسماءهم.</p><button class="btn">نشر</button></form>` : "") +
      (d.data || []).map((x) => `<div class="card"><div class="row"><h3 style="margin:0">${x.pinned ? "📌 " : ""}${esc(x.title)}</h3>${x.author_id === me.teacherId || canLead ? `<span>${canLead ? `<button class="btn sec" data-pin="${esc(x.id)}" data-v="${x.pinned}">${x.pinned ? "إلغاء التثبيت" : "تثبيت"}</button> ` : ""}<button class="btn sec" data-dd="${esc(x.id)}">حذف</button></span>` : ""}</div>
        <p class="muted">${esc(nm(x.author_id))} • ${dt(x.created_at)}</p><p>${nl(x.body)}</p>
        <div style="border-top:1px solid var(--line);padding-top:8px">${(rep[x.id] || []).map((y) => `<div style="padding:6px 0"><b>${esc(nm(y.author_id))}</b> <span class="muted">• ${dt(y.created_at)}</span>${y.author_id === me.teacherId || canLead ? ` <a href="#" data-dr="${esc(y.id)}" class="muted">حذف</a>` : ""}<br>${nl(y.body)}</div>`).join("") || '<span class="muted">لا ردود بعد.</span>'}
        ${canPost ? `<form data-rf="${esc(x.id)}" style="display:flex;gap:8px;margin-top:8px"><input type="text" name="b" placeholder="اكتب ردًا…" required maxlength="2000"><button class="btn">رد</button></form>` : ""}</div></div>`).join("") || '<div class="empty">لا نقاشات بعد. ابدأ أول موضوع.</div>';
    const nd = document.getElementById("nd"); if (nd) nd.onsubmit = async (e) => { e.preventDefault(); const f = new FormData(nd); const { error } = await sb.from("plc_discussions").insert({ group_id: id, author_id: me.teacherId, title: f.get("title").trim(), body: f.get("body").trim() }); if (error) alert("تعذر النشر."); R.dc(); };
    tab.querySelectorAll("[data-rf]").forEach((f) => (f.onsubmit = async (e) => { e.preventDefault(); const { error } = await sb.from("plc_replies").insert({ discussion_id: f.dataset.rf, group_id: id, author_id: me.teacherId, body: new FormData(f).get("b").trim() }); if (error) alert("تعذر الرد."); R.dc(); }));
    tab.onclick = async (e) => { const a = e.target.closest("[data-dd],[data-dr],[data-pin]"); if (!a) return; e.preventDefault();
      if (a.dataset.dd && confirm("حذف الموضوع وردوده؟")) await sb.from("plc_discussions").delete().eq("id", a.dataset.dd);
      if (a.dataset.dr && confirm("حذف الرد؟")) await sb.from("plc_replies").delete().eq("id", a.dataset.dr);
      if (a.dataset.pin) await sb.from("plc_discussions").update({ pinned: a.dataset.v !== "true" }).eq("id", a.dataset.pin);
      R.dc(); };
  };

  /* ---------- مكتبة الملفات ---------- */
  R.fl = async () => {
    const { data } = await sb.from("plc_files").select("*").eq("group_id", id).order("created_at", { ascending: false });
    tab.innerHTML = (canPost ? `<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))"><form class="card" id="uf" style="margin:0"><h3 style="margin-top:0">رفع ملف</h3><label>العنوان *</label><input type="text" name="title" required maxlength="200"><label>التصنيف</label><select name="cat">${Object.entries(FILE_C).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select>
      <label>الملف (PDF، صور، Word، PowerPoint، Excel – حتى 10 ميغابايت)</label><input type="file" name="f" required accept=".pdf,.jpg,.jpeg,.png,.webp,.docx,.pptx,.xlsx"><p class="muted">لا ترفع بيانات طلاب دون تصريح.</p><p id="um" class="err" role="alert"></p><button class="btn">رفع</button></form>
      <form class="card" id="lf" style="margin:0"><h3 style="margin-top:0">إضافة رابط</h3><label>العنوان *</label><input type="text" name="title" required maxlength="200"><label>الرابط *</label><input type="text" name="url" dir="ltr" placeholder="https://" required><label>التصنيف</label><select name="cat">${Object.entries(FILE_C).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select><button class="btn" style="margin-top:10px">إضافة</button></form></div>` : "") +
      `<div style="margin-top:14px">${(data || []).map((x) => `<div class="card"><div class="row"><div><b>${esc(x.title)}</b> <span class="badge">${esc(FILE_C[x.category] || "")}</span><br><span class="muted">${esc(nm(x.uploaded_by))} • ${fmtDate(x.created_at)}${x.size_bytes ? " • " + Math.round(x.size_bytes / 1024) + " ك.ب" : ""}</span></div>
        <span>${x.storage_path ? `<button class="btn" data-dl="${esc(x.storage_path)}">تنزيل</button>` : `<a class="btn" href="${esc(/^https?:\/\//i.test(x.external_url) ? x.external_url : "#")}" target="_blank" rel="noopener noreferrer">فتح الرابط</a>`}
        ${x.uploaded_by === me.teacherId || canLead ? ` <button class="btn sec" data-fd="${esc(x.id)}" data-p="${esc(x.storage_path || "")}">حذف</button>` : ""}</span></div></div>`).join("") || '<div class="empty">المكتبة فارغة.</div>'}</div>`;
    const uf = document.getElementById("uf"); if (uf) uf.onsubmit = async (e) => { e.preventDefault(); const um = document.getElementById("um"); um.textContent = ""; const f = new FormData(uf), file = f.get("f");
      if (!MIME[file.type]) { um.textContent = "نوع الملف غير مسموح."; return; } if (file.size > 10485760) { um.textContent = "الملف أكبر من 10 ميغابايت."; return; }
      const path = `${id}/${crypto.randomUUID()}.${EXT[file.type]}`; const up = await sb.storage.from("plc-files").upload(path, file, { contentType: file.type }); if (up.error) { um.textContent = "تعذر رفع الملف."; return; }
      const { error } = await sb.from("plc_files").insert({ group_id: id, uploaded_by: me.teacherId, title: f.get("title").trim(), category: f.get("cat"), storage_path: path, file_name: file.name.slice(0, 255), mime_type: file.type, size_bytes: file.size });
      if (error) { await sb.storage.from("plc-files").remove([path]); um.textContent = "تعذر تسجيل الملف."; return; } R.fl(); };
    const lf = document.getElementById("lf"); if (lf) lf.onsubmit = async (e) => { e.preventDefault(); const f = new FormData(lf), u = f.get("url").trim(); if (!/^https?:\/\//i.test(u)) { alert("الرابط يجب أن يبدأ بـ https://"); return; }
      const { error } = await sb.from("plc_files").insert({ group_id: id, uploaded_by: me.teacherId, title: f.get("title").trim(), category: f.get("cat"), external_url: u }); if (error) alert("تعذرت الإضافة."); R.fl(); };
    tab.onclick = async (e) => { const d = e.target.closest("[data-dl]"), x = e.target.closest("[data-fd]");
      if (d) { const { data: s } = await sb.storage.from("plc-files").createSignedUrl(d.dataset.dl, 120); if (s?.signedUrl) window.open(s.signedUrl, "_blank", "noopener"); else alert("تعذر فتح الملف."); }
      if (x && confirm("حذف الملف من المكتبة؟")) { if (x.dataset.p) await sb.storage.from("plc-files").remove([x.dataset.p]); await sb.from("plc_files").delete().eq("id", x.dataset.fd); R.fl(); } };
  };

  /* ---------- التوثيق ---------- */
  R.dk = async () => {
    const { data } = await sb.from("plc_docs").select("*").eq("group_id", id).order("doc_date", { ascending: false });
    tab.innerHTML = (canPost ? `<form class="card" id="df"><h3 style="margin-top:0">توثيق جديد</h3><div class="grid"><div><label>العنوان *</label><input type="text" name="title" required maxlength="200"></div><div><label>النوع</label><select name="t">${Object.entries(DOC_T).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div><div><label>التاريخ</label><input type="date" name="d" value="${new Date().toISOString().slice(0, 10)}"></div></div>
      <label>المحتوى *</label><textarea name="b" rows="4" required></textarea><p class="muted">وثّق ما نفذه الفريق ونتائجه دون ذكر بيانات الطلاب.</p><button class="btn">حفظ التوثيق</button></form>` : "") +
      (data || []).map((x) => `<div class="card"><div class="row"><h3 style="margin:0">${esc(x.title)}</h3><span class="badge">${esc(DOC_T[x.doc_type] || "")}</span></div><p class="muted">${esc(nm(x.author_id))} • ${fmtDate(x.doc_date)}</p><p>${nl(x.body)}</p>${x.author_id === me.teacherId || canLead ? `<button class="btn sec" data-xd="${esc(x.id)}">حذف</button>` : ""}</div>`).join("") || '<div class="empty">لا توثيق بعد.</div>';
    const df = document.getElementById("df"); if (df) df.onsubmit = async (e) => { e.preventDefault(); const f = new FormData(df); const { error } = await sb.from("plc_docs").insert({ group_id: id, author_id: me.teacherId, title: f.get("title").trim(), doc_type: f.get("t"), doc_date: f.get("d") || undefined, body: f.get("b").trim() }); if (error) alert("تعذر الحفظ."); R.dk(); };
    tab.onclick = async (e) => { const x = e.target.closest("[data-xd]"); if (x && confirm("حذف التوثيق؟")) { await sb.from("plc_docs").delete().eq("id", x.dataset.xd); R.dk(); } };
  };

  /* ---------- الأحداث القادمة ---------- */
  R.ev = async () => {
    const { data } = await sb.from("plc_events").select("*").eq("group_id", id).order("starts_at");
    const now = Date.now(), up = (data || []).filter((x) => new Date(x.starts_at) >= now), past = (data || []).filter((x) => new Date(x.starts_at) < now).reverse();
    const row = (x) => `<div class="card"><div class="row"><div><b>${esc(x.title)}</b> <span class="badge">${esc(EV_K[x.kind] || "")}</span><br><span class="muted">${dt(x.starts_at)}${x.location ? " • " + esc(x.location) : ""}</span>${x.description ? `<p style="margin:6px 0 0">${nl(x.description)}</p>` : ""}</div>${canLead ? `<button class="btn sec" data-ed="${esc(x.id)}">حذف</button>` : ""}</div></div>`;
    tab.innerHTML = (canLead ? `<form class="card" id="ef"><h3 style="margin-top:0">حدث جديد</h3><div class="grid"><div><label>العنوان *</label><input type="text" name="title" required maxlength="200"></div><div><label>النوع</label><select name="k">${Object.entries(EV_K).map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div><div><label>الموعد *</label><input type="datetime-local" name="s" required></div><div><label>المكان</label><input type="text" name="l"></div></div><label>الوصف</label><textarea name="d" rows="2"></textarea><button class="btn" style="margin-top:8px">إضافة الحدث</button></form>` : "") +
      `<h3>القادمة (${up.length})</h3>${up.map(row).join("") || '<div class="empty">لا أحداث قادمة.</div>'}${past.length ? `<h3>السابقة (${past.length})</h3>${past.map(row).join("")}` : ""}`;
    const ef = document.getElementById("ef"); if (ef) ef.onsubmit = async (e) => { e.preventDefault(); const f = new FormData(ef); const { error } = await sb.from("plc_events").insert({ group_id: id, title: f.get("title").trim(), kind: f.get("k"), starts_at: new Date(f.get("s")).toISOString(), location: f.get("l").trim() || null, description: f.get("d").trim() || null, created_by: me.teacherId }); if (error) alert("تعذرت الإضافة."); R.ev(); };
    tab.onclick = async (e) => { const x = e.target.closest("[data-ed]"); if (x && confirm("حذف الحدث؟")) { await sb.from("plc_events").delete().eq("id", x.dataset.ed); R.ev(); } };
  };

  /* ---------- الاجتماعات ---------- */
  R.mt = async () => {
    const { data } = await sb.from("plc_meetings").select("*").eq("group_id", id).order("scheduled_at", { ascending: false });
    tab.innerHTML = (canLead ? `<form class="card" id="mf"><h3 style="margin-top:0">جدولة اجتماع</h3><div class="grid"><div><label>العنوان *</label><input type="text" name="title" required maxlength="200"></div><div><label>الموعد *</label><input type="datetime-local" name="s" required></div><div><label>المكان</label><input type="text" name="l"></div></div><label>جدول الأعمال</label><textarea name="a" rows="2"></textarea><button class="btn" style="margin-top:8px">جدولة</button></form>` : "") +
      (data || []).map((x) => `<div class="card"><div class="row"><h3 style="margin:0">${esc(x.title)}</h3><span class="badge ${x.status === "held" ? "ok" : x.status === "cancelled" ? "bad" : "warn"}">${esc(MEET_S[x.status] || x.status)}</span></div><p class="muted">${dt(x.scheduled_at)}${x.location ? " • " + esc(x.location) : ""}</p>
        ${x.agenda ? `<h4>جدول الأعمال</h4><p>${nl(x.agenda)}</p>` : ""}${x.minutes ? `<h4>المحضر</h4><p>${nl(x.minutes)}</p>` : ""}${x.recommendations ? `<h4>التوصيات</h4><p>${nl(x.recommendations)}</p>` : ""}
        ${canLead ? `<details><summary class="btn sec" style="display:inline-block">تسجيل المحضر والتوصيات</summary><form data-mf="${esc(x.id)}" style="margin-top:10px"><label>الحالة</label><select name="st">${Object.entries(MEET_S).map(([k, v]) => `<option value="${k}" ${k === x.status ? "selected" : ""}>${v}</option>`).join("")}</select><label>المحضر</label><textarea name="m" rows="3">${esc(x.minutes || "")}</textarea><label>التوصيات</label><textarea name="r" rows="2">${esc(x.recommendations || "")}</textarea><button class="btn" style="margin-top:8px">حفظ</button> <button type="button" class="btn sec" data-md="${esc(x.id)}">حذف الاجتماع</button></form></details>` : ""}</div>`).join("") || '<div class="empty">لا اجتماعات بعد.</div>';
    const mf = document.getElementById("mf"); if (mf) mf.onsubmit = async (e) => { e.preventDefault(); const f = new FormData(mf); const { error } = await sb.from("plc_meetings").insert({ group_id: id, title: f.get("title").trim(), scheduled_at: new Date(f.get("s")).toISOString(), location: f.get("l").trim() || null, agenda: f.get("a").trim() || null, status: "scheduled", created_by: me.id }); if (error) alert("تعذرت الجدولة."); R.mt(); };
    tab.querySelectorAll("[data-mf]").forEach((f) => (f.onsubmit = async (e) => { e.preventDefault(); const v = new FormData(f); const { error } = await sb.from("plc_meetings").update({ status: v.get("st"), minutes: v.get("m").trim() || null, recommendations: v.get("r").trim() || null }).eq("id", f.dataset.mf); if (error) alert("تعذر الحفظ."); R.mt(); }));
    tab.onclick = async (e) => { const d = e.target.closest("[data-md]"); if (d && confirm("حذف الاجتماع؟")) { await sb.from("plc_meetings").delete().eq("id", d.dataset.md); R.mt(); } };
  };

  /* ---------- خطة المجتمع ---------- */
  R.pl = async () => {
    const { data: tasks } = await sb.from("plc_tasks").select("*").eq("group_id", id).order("due_date", { nullsFirst: false });
    const fresh = (await sb.from("plc_groups").select("goals,work_plan,work_plan_status").eq("id", id).maybeSingle()).data || G; Object.assign(G, fresh);
    const ed = canLead && !["approved", "under_review"].includes(G.work_plan_status);
    tab.innerHTML = `<div class="card"><div class="row"><h3 style="margin:0">خطة العمل</h3><span class="badge ${G.work_plan_status === "approved" ? "ok" : "warn"}">${esc(PLAN_S[G.work_plan_status] || G.work_plan_status)}</span></div>
      ${ed ? `<form id="pf"><label>الأهداف</label><textarea name="g" rows="3">${esc(G.goals || "")}</textarea><label>خطة العمل (المحاور، الجدول، المخرجات المتوقعة، مؤشرات الأثر)</label><textarea name="w" rows="6">${esc(G.work_plan || "")}</textarea><p id="pm" class="okmsg"></p><button class="btn" value="draft">حفظ كمسودة</button> <button class="btn sec" value="submitted">حفظ وإرسال للاعتماد</button></form>`
      : `<h4>الأهداف</h4><p>${nl(G.goals) || '<span class="muted">—</span>'}</p><h4>خطة العمل</h4><p>${nl(G.work_plan) || '<span class="muted">لم تُكتب خطة بعد.</span>'}</p>${canLead ? '<p class="note">الخطة بعد الإرسال أو الاعتماد لا تُعدَّل إلا بإعادتها من الإدارة.</p>' : ""}`}
      ${isReviewer(me) && G.work_plan_status === "submitted" && isMgr ? `<hr><button class="btn" data-pa="approved">اعتماد الخطة</button> <button class="btn sec" data-pa="needs_revision">إعادة للتعديل</button>` : ""}</div>
      <div class="card"><h3 style="margin-top:0">المهام</h3>${(tasks || []).map((x) => `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div><b>${esc(x.title)}</b><br><span class="muted">${esc(nm(x.assignee_id))}${x.due_date ? " • الموعد " + fmtDate(x.due_date) : ""}</span></div>
        <span>${canLead || x.assignee_id === me.teacherId ? `<select data-ts="${esc(x.id)}">${Object.entries(TASK_S).map(([k, v]) => `<option value="${k}" ${k === x.status ? "selected" : ""}>${v}</option>`).join("")}</select>` : `<span class="badge">${esc(TASK_S[x.status])}</span>`}${canLead ? ` <button class="btn sec" data-td="${esc(x.id)}">حذف</button>` : ""}</span></div>`).join("") || '<p class="muted">لا مهام بعد.</p>'}
      ${canLead ? `<form id="tf" style="margin-top:12px" class="grid"><div><label>مهمة جديدة *</label><input type="text" name="t" required maxlength="200"></div><div><label>المسؤول</label><select name="a"><option value="">—</option>${memberOpts("")}</select></div><div><label>الموعد</label><input type="date" name="d"></div><div style="align-self:end"><button class="btn">إضافة</button></div></form>` : ""}</div>`;
    const pf = document.getElementById("pf"); if (pf) pf.onsubmit = async (e) => { e.preventDefault(); const st = e.submitter.value, f = new FormData(pf);
      const { error } = await sb.from("plc_groups").update({ goals: f.get("g").trim() || null, work_plan: f.get("w").trim() || null, work_plan_status: st }).eq("id", id); if (error) { document.getElementById("pm").className = "err"; document.getElementById("pm").textContent = "تعذر الحفظ."; return; } R.pl(); };
    const tf = document.getElementById("tf"); if (tf) tf.onsubmit = async (e) => { e.preventDefault(); const f = new FormData(tf); const { error } = await sb.from("plc_tasks").insert({ group_id: id, title: f.get("t").trim(), assignee_id: f.get("a") || null, due_date: f.get("d") || null, status: "open", created_by: me.id }); if (error) alert("تعذرت الإضافة."); R.pl(); };
    tab.onchange = async (e) => { const s = e.target.closest("[data-ts]"); if (s) { const { error } = await sb.from("plc_tasks").update({ status: s.value }).eq("id", s.dataset.ts); if (error) alert("تعذر التحديث."); } };
    tab.onclick = async (e) => { const d = e.target.closest("[data-td]"), a = e.target.closest("[data-pa]");
      if (d && confirm("حذف المهمة؟")) { await sb.from("plc_tasks").delete().eq("id", d.dataset.td); R.pl(); }
      if (a) { await sb.from("plc_groups").update({ work_plan_status: a.dataset.pa }).eq("id", id); R.pl(); } };
  };

  const show = (k) => { if (!R[k]) k = "ov"; main.querySelectorAll(".tabs button").forEach((b) => b.classList.toggle("on", b.dataset.k === k)); tab.onclick = null; tab.onchange = null; tab.innerHTML = '<p class="muted">جارٍ التحميل…</p>'; history.replaceState(null, "", "#" + k); R[k]().catch((e) => { console.error(e); tab.innerHTML = '<p class="err">تعذر تحميل هذا القسم.</p>'; }); };
  main.querySelector(".tabs").onclick = (e) => { const b = e.target.closest("button"); if (b) show(b.dataset.k); };
  show(location.hash.slice(1) || "ov");
});
</script></body></html>
