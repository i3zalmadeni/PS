<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>النمو المهني – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script>
</head><body><div id="shell"></div><script>

boot("growth.html", async (me, main) => {
  if (!me.teacherId) { main.innerHTML = header("النمو المهني") + '<div class="note">حسابك غير مرتبط بملف معلم.</div>'; return; }
  const [plan, sk] = await Promise.all([
    sb.from("professional_plans").select("title,academic_year,target_areas").eq("status", "active").limit(1).maybeSingle(),
    sb.from("skills").select("id,name").order("name")]);
  main.innerHTML = header("النمو المهني", "أهدافك وأنشطتها. هي خاصة بك ويراها المراجعون فقط.") +
    (plan.data ? `<div class="card"><span class="muted">خطة المدرسة • ${esc(plan.data.academic_year)}</span><br><b>${esc(plan.data.title)}</b>${plan.data.target_areas?.length ? `<br><span class="muted">المجالات: ${esc(plan.data.target_areas.join("، "))}</span>` : ""}</div>` : "") +
    `<form class="card" id="gf"><h3 style="margin-top:0">هدف جديد</h3><label>عنوان الهدف *</label><input type="text" name="title" required maxlength="200">
    <label>الوصف</label><textarea name="description" rows="2"></textarea>
    <div class="grid"><div><label>المهارة المستهدفة</label><select name="skill"><option value="">—</option>${(sk.data || []).map((s) => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></div>
    <div><label>تاريخ البداية</label><input type="date" name="sd"></div><div><label>تاريخ الإنجاز المتوقع</label><input type="date" name="td"></div></div>
    <p id="gm" class="err"></p><button class="btn">حفظ الهدف</button></form><div id="gl"></div>`;
  async function load() {
    const { data } = await sb.from("professional_goals").select("*, skills(name), goal_activities(id,title,status)").eq("teacher_id", me.teacherId).order("created_at", { ascending: false });
    gl.innerHTML = (data || []).length ? data.map((g) => { const acts = g.goal_activities || []; return `<div class="card"><div class="row"><b>${esc(g.title)}</b><span class="badge ${g.status === "completed" ? "ok" : ""}">${esc(GOAL_LABELS[g.status])}</span></div>
      <p class="muted">${esc(g.skills?.name || "")} ${g.start_date ? "• " + fmtDate(g.start_date) : ""} ${g.target_date ? "← " + fmtDate(g.target_date) : ""}</p>${g.description ? `<p>${esc(g.description)}</p>` : ""}
      <div>${acts.map((a) => `<p><a href="#" data-t="${esc(a.id)}" data-d="${a.status === "done" ? 1 : 0}">${a.status === "done" ? "✓" : "○"}</a> ${esc(a.title)}</p>`).join("")}</div>
      <form data-act="${esc(g.id)}" class="row"><input type="text" name="t" placeholder="نشاط جديد" required style="flex:1"><button class="btn sec">إضافة</button></form>
      <form data-up="${esc(g.id)}" class="row" style="margin-top:8px"><select name="st">${Object.entries(GOAL_LABELS).map(([k, v]) => `<option value="${k}" ${k === g.status ? "selected" : ""}>${v}</option>`).join("")}</select><button class="btn sec">تحديث الحالة</button></form></div>`; }).join("") : '<p class="muted">لا توجد أهداف بعد. ابدأ بهدف واحد.</p>';
  }
  gf.onsubmit = async (ev) => { ev.preventDefault(); const f = new FormData(gf); gm.textContent = "";
    const { error } = await sb.from("professional_goals").insert({ teacher_id: me.teacherId, title: f.get("title").trim(), description: f.get("description").trim() || null, skill_id: f.get("skill") || null, start_date: f.get("sd") || null, target_date: f.get("td") || null, created_by: me.id });
    if (error) { gm.textContent = "تعذر الحفظ. تأكد أن تاريخ الإنجاز بعد البداية."; return; } gf.reset(); load(); };
  main.addEventListener("submit", async (ev) => { const f = ev.target; if (f.dataset.act) { ev.preventDefault(); await sb.from("goal_activities").insert({ goal_id: f.dataset.act, title: f.t.value.trim() }); load(); }
    if (f.dataset.up) { ev.preventDefault(); const st = f.st.value; await sb.from("professional_goals").update({ status: st, completed_at: st === "completed" ? new Date().toISOString().slice(0, 10) : null }).eq("id", f.dataset.up); load(); } });
  main.addEventListener("click", async (ev) => { const a = ev.target.closest("a[data-t]"); if (!a) return; ev.preventDefault(); await sb.from("goal_activities").update({ status: a.dataset.d === "1" ? "open" : "done" }).eq("id", a.dataset.t); load(); });
  load();
});
</script></body></html>
