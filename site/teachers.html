<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>المعلمون – مجتمع المعلمين الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/app.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js"></script><script src="assets/app.js"></script>
</head><body><div id="shell"></div><script>

boot("teachers.html", async (me, main) => {
  const id = new URLSearchParams(location.search).get("id");
  if (id) return detail(id, main);
  main.innerHTML = header("المعلمون", "دليل الملفات المهنية. الرقم الوظيفي والبريد والجوال لا تظهر لغير صاحبها والإدارة.") +
    `<input class="field" id="q" placeholder="بحث بالاسم أو التخصص" style="max-width:360px;margin-bottom:14px"><div id="list" class="grid"></div>`;
  const { data } = await sb.from("teachers").select("id,full_name,specialty,stage").eq("is_active", true).order("full_name");
  const draw = () => {
    const t = q.value.trim();
    const rows = (data || []).filter((r) => !t || (r.full_name + " " + (r.specialty || "")).includes(t));
    list.innerHTML = rows.length ? rows.map((r) => `<a class="card" style="text-decoration:none" href="teachers.html?id=${encodeURIComponent(r.id)}"><b>${esc(r.full_name)}</b><br><span class="muted">${esc(r.specialty || "—")}${r.stage ? " • " + esc(r.stage) : ""}</span></a>`).join("")
      : `<p class="muted">لا توجد نتائج. ${isReviewer(me) ? "استورد المعلمين لاحقًا من لوحة الإدارة." : ""}</p>`;
  };
  q.oninput = draw; draw();
});
async function detail(id, main) {
  const [t, p, q, s, a] = await Promise.all([
    sb.from("teachers").select("full_name,specialty,stage,years_experience").eq("id", id).maybeSingle(),
    sb.from("professional_profiles").select("bio,professional_interests,reflection_strengths,reflection_development,reflection_future").eq("teacher_id", id).maybeSingle(),
    sb.from("teacher_qualifications").select("degree,major,institution,graduation_year,verification_status").eq("teacher_id", id),
    sb.from("teacher_skills").select("level,verification_status,skills(name)").eq("teacher_id", id),
    sb.from("achievements").select("title,achievement_type,achieved_on,status").eq("teacher_id", id).eq("status", "approved").order("achieved_on", { ascending: false }),
  ]);
  if (!t.data) { main.innerHTML = '<p class="err">الملف غير موجود.</p>'; return; }
  const d = t.data, pr = p.data || {};
  const sec = (title, body) => body ? `<div class="card"><h3 style="margin-top:0">${title}</h3>${body}</div>` : "";
  main.innerHTML = `<p><a href="teachers.html">← الدليل</a></p>` + header(d.full_name, [d.specialty, d.stage, d.years_experience != null ? d.years_experience + " سنة خبرة" : null].filter(Boolean).join(" • ")) +
    sec("نبذة مهنية", pr.bio ? `<p style="white-space:pre-wrap">${esc(pr.bio)}</p>` : "") +
    sec("الاهتمامات", (pr.professional_interests || []).map((i) => `<span class="badge">${esc(i)}</span> `).join("")) +
    sec("المؤهلات", (q.data || []).map((x) => `<p>${esc(x.degree)} ${esc(x.major || "")} ${esc(x.institution ? "، " + x.institution : "")} ${x.graduation_year ? "(" + x.graduation_year + ")" : ""} ${x.verification_status === "approved" ? '<span class="badge ok">موثّق</span>' : '<span class="badge">لم يُتحقق منه</span>'}</p>`).join("")) +
    sec("المهارات", (s.data || []).map((x) => `<span class="badge">${esc(x.skills?.name)}${x.level ? " • " + x.level + "/5" : ""}</span> `).join("")) +
    sec("الإنجازات المعتمدة", (a.data || []).map((x) => `<p>${esc(x.title)} <span class="muted">• ${esc(ACH_TYPES[x.achievement_type] || "")} • ${fmtDate(x.achieved_on)}</span></p>`).join("")) +
    sec("التأمل المهني", [["نقاط القوة", pr.reflection_strengths], ["مجالات التطوير", pr.reflection_development], ["الأهداف المستقبلية", pr.reflection_future]].filter((r) => r[1]).map((r) => `<p><b>${r[0]}:</b> ${esc(r[1])}</p>`).join(""));
}
</script></body></html>
